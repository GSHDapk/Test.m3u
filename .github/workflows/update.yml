name: Netspor Bot - Auto Update

on:
  schedule:
    # Her 4 saatte bir çalıştır (İstediğiniz gibi değiştirebilirsiniz)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  update-links:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # GitHub Actions'ın repoya dosya commit etmesine izin verir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run bot script
        run: python bot.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add netspor.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Netspor links [skip ci]" && git push)
