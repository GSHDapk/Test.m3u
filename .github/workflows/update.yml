name: Otomatik M3U Guncelleme

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir otomatik çalışır
  workflow_dispatch: # İSTEDİĞİN ZAMAN MANUEL ÇALIŞTIRABİLMEK İÇİN

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scripti Calistir (M3U Olustur)
        run: python main.py

      - name: Degisiklikleri Kaydet ve Git'e Gonder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add kanallar.m3u
          git diff --staged --quiet || git commit -m "Otomatik M3U Guncellemesi [skip ci]"
          git push
